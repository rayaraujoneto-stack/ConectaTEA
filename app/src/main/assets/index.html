<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConectaTEA</title><style>
*{box-sizing:border-box}body{font:17px system-ui,Arial;background:#eff6ff;color:#20365c;margin:0}header{padding:16px;background:#fff;display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}small{color:#516684}main{max-width:950px;margin:auto;padding:14px 14px 100px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}button{font:inherit;cursor:pointer;border:0;border-radius:15px;padding:15px;touch-action:manipulation}button:focus-visible{outline:3px solid #0e5de4}button.tab{background:white;color:#29426e;font-weight:700}.tab.active{background:#2859b3;color:white}.screen{display:none}.screen.active{display:block}.message{position:sticky;top:0;background:white;padding:14px;border-radius:17px;z-index:2;box-shadow:0 2px 12px #20365c18}.sentence{min-height:34px;font-size:22px;font-weight:600}.row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.primary{background:#275db8;color:white}.secondary{background:#e3eaf6;color:#223f78}h2{font-size:20px;margin:22px 2px 9px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.card{background:white;border:2px solid #dce6f7;min-height:106px;padding:8px 3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;box-shadow:0 2px 3px #0000000a}.card .emoji{font-size:39px;line-height:1.1}.card .label{font-size:15px;font-weight:700;text-align:center}.card:active{background:#d9ecff}.item{background:white;border-radius:15px;padding:12px;display:flex;align-items:center;gap:12px;margin-bottom:9px}.item span{font-size:31px}.item label{flex:1}.item.done{opacity:.62}.panel{background:white;padding:16px;border-radius:17px}input{padding:12px;border:1px solid #ccd7e6;border-radius:12px;max-width:100%;font:inherit}.quiz{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quiz button{background:white;border:2px solid #cedcf4;font-size:40px;min-height:115px}.quiz button:active{background:#cce6ff}#feedback{font-size:20px;font-weight:700;min-height:32px}@media(min-width:650px){.cards{grid-template-columns:repeat(5,1fr)}}
</style></head><body><header><div><h1>💙 ConectaTEA</h1><small>Minha voz, minhas escolhas</small></div><span>🇧🇷</span></header><main><nav class="tabs"><button class="tab active" onclick="tab('com')">💬 Comunicar</button><button class="tab" onclick="tab('rot')">📅 Rotina</button><button class="tab" onclick="tab('apr')">🧩 Aprender</button></nav>
<section class="screen active" id="com"><div class="message"><small>Minha mensagem</small><div class="sentence" id="sentence">Toque em um cartão</div><div class="row"><button class="primary" onclick="speak(words.join(' '))">🔊 Falar frase</button><button class="secondary" onclick="words.pop();renderSentence()">⌫ Apagar</button><button class="secondary" onclick="words=[];renderSentence()">Limpar</button></div></div><div id="cardlists"></div></section>
<section class="screen" id="rot"><h2>Minha rotina</h2><div id="tasks"></div><div class="panel"><label>Adicionar atividade</label><div class="row"><input id="newTask" placeholder="Ex.: tomar banho"><button class="primary" onclick="addTask()">Adicionar</button></div><button class="secondary" onclick="resetTasks()">Reiniciar marcações</button></div></section>
<section class="screen" id="apr"><h2>Aprender brincando</h2><div class="panel"><p>Toque na figura correspondente à palavra:</p><h2 id="target"></h2><div class="quiz" id="options"></div><p id="feedback" aria-live="polite"></p><button class="secondary" onclick="next()">Próxima atividade ➜</button></div></section></main>
<script>
const groups={"Essenciais":[["🙋","Eu"],["🙏","Quero"],["✅","Sim"],["❌","Não"],["🆘","Ajuda"],["🛑","Parar"],["👍","Mais"],["👋","Olá"],["❤️","Gosto"]],
"Necessidades":[["💧","Água"],["🍎","Comer"],["🚽","Banheiro"],["😴","Dormir"],["🧸","Brincar"],["🫂","Abraço"],["🧼","Lavar"],["🏠","Casa"],["🌳","Sair"],["🤕","Dor"],["🥶","Frio"],["🥵","Calor"]],
"Sentimentos":[["😊","Feliz"],["😢","Triste"],["😠","Bravo"],["😨","Medo"],["😌","Calmo"],["😩","Cansado"],["🔊","Barulho"],["🧘","Silêncio"]],
"Atividades":[["📚","Estudar"],["🎨","Desenhar"],["🎵","Música"],["⚽","Bola"],["📺","Assistir"],["🚶","Passear"],["🎒","Escola"]]};
let words=[];function speak(t){if(!t)return;if(window.AndroidSpeech?.speak){window.AndroidSpeech.speak(t);return}if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.88;speechSynthesis.speak(u)}}
function renderSentence(){document.getElementById('sentence').textContent=words.join(' ')||'Toque em um cartão'}
function choose(t){words.push(t.toLowerCase());renderSentence();speak(t==='Água'?'Quero água, por favor':t)}
const holder=document.getElementById('cardlists');for(const [name,cards]of Object.entries(groups)){let h=document.createElement('h2');h.textContent=name;holder.append(h);let grid=document.createElement('div');grid.className='cards';cards.forEach(([emoji,txt])=>{let b=document.createElement('button');b.className='card';b.innerHTML='<span class="emoji"></span><span class="label"></span>';b.children[0].textContent=emoji;b.children[1].textContent=txt;b.onclick=()=>choose(txt);grid.append(b)});holder.append(grid)}
function tab(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('active',e.id===id));document.querySelectorAll('.tab').forEach((e,i)=>e.classList.toggle('active',['com','rot','apr'][i]===id))}
const initial=[['☀️','Acordar',false],['🪥','Escovar os dentes',false],['🥪','Tomar café',false],['🎒','Ir à escola',false],['🍛','Almoçar',false],['🧸','Brincar',false],['🌙','Dormir',false]];
let tasks;try{tasks=JSON.parse(localStorage.getItem('ct_tasks'))||initial}catch(e){tasks=initial}
function persist(){localStorage.setItem('ct_tasks',JSON.stringify(tasks))}
function renderTasks(){const d=document.getElementById('tasks');d.replaceChildren();tasks.forEach((t,i)=>{let r=document.createElement('div');r.className='item'+(t[2]?' done':'');let e=document.createElement('span');e.textContent=t[0];let l=document.createElement('label');l.textContent=t[1];let c=document.createElement('input');c.type='checkbox';c.checked=!!t[2];c.onchange=()=>{tasks[i][2]=c.checked;persist();renderTasks()};let x=document.createElement('button');x.className='secondary';x.textContent='✕';x.setAttribute('aria-label','Remover atividade');x.onclick=()=>{tasks.splice(i,1);persist();renderTasks()};r.append(e,l,c,x);d.append(r)})}
function addTask(){let f=document.getElementById('newTask');let v=f.value.trim();if(!v)return;tasks.push(['📌',v,false]);f.value='';persist();renderTasks()}
function resetTasks(){tasks.forEach(t=>t[2]=false);persist();renderTasks()}renderTasks();
const quizItems=[['🍎','Maçã'],['🐶','Cachorro'],['🚗','Carro'],['⚽','Bola'],['🏠','Casa'],['🌳','Árvore'],['📚','Livro'],['💧','Água']];let answer;
function next(){const sorted=[...quizItems].sort(()=>Math.random()-.5);let choices=sorted.slice(0,4);answer=choices[Math.floor(Math.random()*4)][1];document.getElementById('target').textContent=answer;document.getElementById('feedback').textContent='';const o=document.getElementById('options');o.replaceChildren();choices.forEach(([emoji,name])=>{let b=document.createElement('button');b.textContent=emoji;b.setAttribute('aria-label',name);b.onclick=()=>{const ok=name===answer;document.getElementById('feedback').textContent=ok?'Muito bem! 🌟':'Pode tentar novamente';speak(ok?'Muito bem!':name)};o.append(b)})}next();
</script></body></html>
